name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build signed APK
        run: |
          set -o pipefail
          gradle assembleRelease -PversionCode=${{ github.run_number }} --no-daemon --console=plain 2>&1 | tee build.log || {
            grep -E "error:|e: |ERROR|What went wrong|Could not|Caused by|\.java:[0-9]+|\.xml" build.log | head -40 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk KitchenCamera.apk

      - uses: actions/upload-artifact@v4
        with:
          name: KitchenCamera
          path: KitchenCamera.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Kitchen Camera 1.0.${{ github.run_number }}
          body: Download KitchenCamera.apk below and open it on your phone to install or update.
          files: KitchenCamera.apk
          make_latest: true
